# Лес Любви — пример конфигурации Nginx + PHP-FPM (HTTPS обязателен: камера и геолокация в браузере работают только по HTTPS)
server {
    listen 80;
    server_name forest.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name forest.example.com;
    root /var/www/forest/web;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/forest.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forest.example.com/privkey.pem;

    client_max_body_size 20m;   # upload.maxFileSize + запас
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), geolocation=(self)" always;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Загрузки: только статика, исполнение скриптов запрещено
    location ^~ /uploads/ {
        location ~* \.(php\d?|phtml|phar|pl|py|cgi|sh)$ { deny all; }
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ ^/assets/.+\.(css|js|map|woff2?|svg|png|jpg)$ {
        expires 30d;
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) { deny all; }
}
